[package]
name = "fsrs_ex"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[dependencies]
fsrs = "6.6.2"
rustler = "0.38.0"

[lib]
name = "fsrs_ex"
path = "src/lib.rs"
crate-type = ["cdylib"]

[target.x86_64-unknown-linux-musl]
rustflags = [
  "-C", "target-feature=-crt-static"
]

[target.aarch64-unknown-linux-musl]
rustflags = [
  "-C", "target-feature=-crt-static"
]

[profile.release]
lto = true
